[workspace]
name = "polymer_simulations"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
# C++ toolchain and libraries
cxx-compiler = "*"
make = "*"
gsl = "*"
yaml-cpp = "*"
# Python analysis scripts
python = "3.12.*"
numpy = "*"
pyyaml = "*"

[tasks]
build = "make -C langevin"
build-mc = "make -C montecarlo"
check = "make -C langevin check"
golden = "make -C langevin golden"
clean = "make -C langevin clean && make -C montecarlo clean"

# visualization with PyMOL (pymol/); movies need ffmpeg and ImageMagick
[feature.viz.dependencies]
pymol-open-source = "*"
ffmpeg = "*"
imagemagick = "*"

[environments]
viz = ["viz"]
