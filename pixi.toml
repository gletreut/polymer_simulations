[workspace]
name = "polymer_simulations"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
# C++ toolchain and libraries for langevin/
cxx-compiler = "*"
make = "*"
gsl = "*"
libboost-devel = "*"
yaml-cpp = "*"
# Python analysis scripts
python = "3.12.*"
numpy = "*"
scipy = "*"
matplotlib = "*"
pyyaml = "*"

[tasks]
build = "make -C langevin"
clean = "make -C langevin clean"

[feature.viz.dependencies]
pymol-open-source = "*"

[environments]
viz = ["viz"]
